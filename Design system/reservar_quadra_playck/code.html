<script>
        function selectSlot(element) {
            // Reset all slots
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('bg-primary-container', 'text-on-primary');
                slot.classList.add('bg-surface', 'text-primary-container');
            });

            // Select clicked slot
            element.classList.remove('bg-surface', 'text-primary-container');
            element.classList.add('bg-primary-container', 'text-on-primary');

            // Show confirm button
            const confirmBtn = document.getElementById('confirm-action');
            confirmBtn.classList.remove('hidden');
            confirmBtn.classList.add('flex');
        }

        function confirmBooking() {
            // Hide booking section
            document.getElementById('booking-section').classList.add('hidden');
            
            // Show success section
            const successSection = document.getElementById('success-section');
            successSection.classList.remove('hidden');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
