], "title-lg": ["18px", {lineHeight: "24px", fontWeight: "600"}], "body-md": ["14px", {lineHeight: "20px", fontWeight: "400"}], "display-md": ["24px", {lineHeight: "30px", letterSpacing: "-0.01em", fontWeight: "700"}], "label-sm": ["12px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600"}], "label-md": ["13px", {lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "500"}], "display-lg": ["28px", {lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "700"}], "title-md": ["16px", {lineHeight: "22px", fontWeight: "600"}]}}}};</script>
<style>
        body {
            background-color: #F7F6F1; /* Warm off-white requested */
        }
        
        /* Subtle tennis court lines background pattern */
        .court-pattern {
            background-image: linear-gradient(rgba(20, 82, 36, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(20, 82, 36, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        .card-shadow {
            box-shadow: 0px 8px 24px rgba(18, 20, 15, 0.12);
        }

        /* Input focus transitions */
        .input-transition {
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

    body {

<body class="min-h-screen flex items-center justify-center p-margin-mobile relative overflow-hidden text-on-surface">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 court-pattern pointer-events-none z-0"></div>
<div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-primary-fixed/20 to-transparent pointer-events-none z-0"></div>
<!-- Login Card -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl card-shadow p-xl relative z-10 overflow-hidden">
<!-- Decorative Thematic Element inside card -->
<div class="absolute top-0 right-0 w-32 h-32 opacity-5 pointer-events-none">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M10 10 H90 V90 H10 Z" stroke="currentColor" stroke-width="4"></path>
<path d="M10 50 H90" stroke="currentColor" stroke-width="4"></path>
<path d="M50 10 V90" stroke="currentColor" stroke-width="2"></path>
</svg>
</div>
<!-- Header -->
<div class="text-center mb-xl">
<!-- Brand Logo/Name -->
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container text-on-primary-container rounded-full mb-md shadow-md">
<span class="material-symbols-outlined text-display-lg" style="font-variation-settings: 'FILL' 1;">
                    sports_tennis
                </span>
</div>
<h1 class="text-display-md font-display-md text-primary mb-xs">Entrar</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Suas aulas e reservas de quadra — PlayCK</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-xs" for="email">E-mail</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-sm text-body-lg font-body-lg text-on-surface bg-surface border border-[#D1D1CB] rounded focus:outline-none focus:ring-0 focus:border-primary focus:border-2 input-transition placeholder:text-outline-variant" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-xs" for="password">Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-[40px] pr-[40px] py-sm text-body-lg font-body-lg text-on-surface bg-surface border border-[#D1D1CB] rounded focus:outline-none focus:ring-0 focus:border-primary focus:border-2 input-transition placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Password Toggle -->
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="text-label-sm font-label-sm text-primary hover:text-primary-container transition-colors" href="#">Esqueceu a senha?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#2F6B3A] text-on-primary text-title-md font-title-md h-[52px] rounded-lg mt-lg flex items-center justify-center gap-xs hover:bg-primary transition-all duration-200 active:scale-[0.98] shadow-md hover:shadow-lg" type="submit">
                Entrar
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Sign Up Prompt -->
<div class="mt-lg text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                Ainda não tem conta? 
                <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-2" href="#">Cadastre-se</a>
</p>
</div>
</main>
<script>
        // Simple password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
