<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>PlayCK - Entrar</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#f7f8f5",
            surface: "#ffffff",
            "surface-soft": "#eef4ed",
            "text-primary": "#12160f",
            "text-secondary": "#4e5951",
            primary: "#00763a",
            secondary: "#00bd90",
            tertiary: "#ed0040",
            border: "#dde6db"
          },
          boxShadow: {
            soft: "0 8px 24px rgba(18, 20, 15, 0.08)",
            lift: "0 18px 44px rgba(18, 20, 15, 0.16)",
            glow: "0 16px 40px rgba(0, 156, 63, 0.22)"
          }
        }
      }
    };
  </script>
  <style>
    html { font-family: Inter, system-ui, sans-serif; }
    body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }
    .material-symbols-outlined[data-fill="true"] { font-variation-settings: "FILL" 1, "wght" 650, "GRAD" 0, "opsz" 24; }
    .court-bg {
      background: radial-gradient(circle at 78% 20%, rgba(0, 189, 144, 0.3) 0 16%, transparent 17%), linear-gradient(145deg, #0a6a37, #05391f);
    }
    .court-bg::before,
    .court-bg::after {
      content: "";
      position: absolute;
      inset: 18px;
      z-index: 0;
      border-radius: 22px;
      pointer-events: none;
    }
    .court-bg::before { border: 2px solid rgba(255,255,255,0.18); }
    .court-bg::after {
      background: linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,0.14) calc(50% - 1px), rgba(255,255,255,0.14) calc(50% + 1px), transparent calc(50% + 1px)), linear-gradient(0deg, transparent calc(50% - 1px), rgba(255,255,255,0.12) calc(50% - 1px), rgba(255,255,255,0.12) calc(50% + 1px), transparent calc(50% + 1px));
    }
    .tennis-ball {
      background: radial-gradient(circle at 30% 26%, #d9ff4f 0 12%, transparent 13%), radial-gradient(circle at 50% 50%, #baff2a 0 58%, #85d61f 59% 100%);
    }
    .tennis-ball::before,
    .tennis-ball::after {
      content: "";
      position: absolute;
      top: 10%;
      width: 38%;
      height: 80%;
      border: 2px solid rgba(255,255,255,0.78);
      border-top-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(-18deg);
    }
    .tennis-ball::before { left: 8%; }
    .tennis-ball::after { right: 8%; }
  </style>
</head>
<body class="bg-background text-text-primary">
  <main class="mx-auto flex min-h-screen w-full max-w-[430px] flex-col gap-8 overflow-hidden bg-background px-5 py-6 shadow-[0_0_60px_rgba(18,20,15,0.08)]">
    <section class="relative overflow-hidden rounded-3xl court-bg p-5 text-white shadow-lift">
      <div class="relative z-10 min-h-[260px]">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="flex size-12 items-center justify-center rounded-2xl bg-white text-primary">
              <span class="material-symbols-outlined" data-fill="true">sports_tennis</span>
            </div>
            <div>
              <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-white/70">PlayCK Club</p>
              <h1 class="text-[24px] font-extrabold leading-none">PlayCK</h1>
            </div>
          </div>
          <div class="relative flex size-[58px] items-center justify-center rounded-3xl bg-white/10">
            <div class="tennis-ball relative size-[42px] rounded-full shadow-glow"></div>
          </div>
        </div>

        <div class="mt-12">
          <div class="mb-3 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1.5 text-[11px] font-bold uppercase tracking-[0.12em] text-white/80">
            <span class="size-2 rounded-full bg-secondary"></span>
            Área do aluno
          </div>
          <h2 class="text-[34px] font-extrabold leading-[1.02]">Entre no seu clube.</h2>
          <p class="mt-3 max-w-[280px] text-[14px] font-semibold leading-5 text-white/70">Acompanhe aulas, reserve quadras e mantenha seu ritmo de treino.</p>
        </div>
      </div>
    </section>

    <section class="-mt-3 rounded-3xl bg-surface p-5 shadow-lift ring-1 ring-border">
      <div class="mb-5">
        <p class="text-[12px] font-extrabold uppercase tracking-[0.12em] text-primary">Login</p>
        <h3 class="mt-1 text-[24px] font-extrabold">Bem-vindo de volta</h3>
      </div>
      <form class="space-y-4">
        <label class="block">
          <span class="mb-2 block text-[13px] font-extrabold text-text-primary">E-mail</span>
          <div class="flex h-[52px] items-center gap-3 rounded-2xl bg-surface-soft px-4 ring-1 ring-border">
            <span class="material-symbols-outlined text-[20px] text-primary">mail</span>
            <input class="h-[52px] min-w-0 flex-1 border-0 bg-transparent p-0 text-[15px] font-semibold text-text-primary placeholder:text-text-secondary focus:ring-0" placeholder="voce@email.com" type="email" />
          </div>
        </label>
        <label class="block">
          <span class="mb-2 block text-[13px] font-extrabold text-text-primary">Senha</span>
          <div class="flex h-[52px] items-center gap-3 rounded-2xl bg-surface-soft px-4 ring-1 ring-border">
            <span class="material-symbols-outlined text-[20px] text-primary">lock</span>
            <input class="h-[52px] min-w-0 flex-1 border-0 bg-transparent p-0 text-[15px] font-semibold text-text-primary placeholder:text-text-secondary focus:ring-0" placeholder="Sua senha" type="password" />
            <button type="button" class="flex size-9 items-center justify-center rounded-xl text-text-secondary" aria-label="Mostrar senha">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </label>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-[13px] font-bold text-text-secondary">
            <input class="size-4 rounded border-border text-primary focus:ring-primary" type="checkbox" />
            Lembrar
          </label>
          <a class="text-[13px] font-extrabold text-primary" href="#">Esqueci a senha</a>
        </div>
        <button class="h-12 w-full rounded-2xl bg-primary text-[15px] font-extrabold text-white shadow-glow" type="submit">Entrar</button>
      </form>
      <p class="mt-5 text-center text-[13px] font-bold text-text-secondary">
        Primeiro acesso?
        <a class="text-primary" href="#">Ativar conta</a>
      </p>
    </section>
  </main>
</body>
</html>
