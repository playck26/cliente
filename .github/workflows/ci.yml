name: CI

# SPEC-001:TASK-010 — 1 workflow por repositório (poly-repo, ADR-001).
# Só valida este repositório, não depende de nenhum outro dos 4.
on:
  pull_request:
  push:
    branches: [main]
  # SPEC-067/TASK-002 — a PR-espelho `contrato/sync` e aberta pelo
  # `GITHUB_TOKEN`, e o GitHub NAO dispara workflows por eventos desse token
  # (exceto `workflow_dispatch`). Sem esta linha a PR ficaria para sempre
  # "aguardando status"; o `sincronizar-contrato.mjs` dispara o CI por aqui.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # SPEC-062/INV-062b — a chave privada VAPID nao alcanca o navegador.
      # Roda ANTES do lint: se um segredo entrou, a formatacao do codigo
      # e a ultima coisa que importa.
      - run: node scripts/gates-de-push.mjs

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

  # SPEC-067/TASK-001 — os tipos gerados correspondem ao contrato FIXADO?
  #
  # Job proprio, e nao um passo do `build`, porque e pelo NOME que o ruleset o
  # exige (TASK-004). **E ele JA exige** -- conferido em 2026-09-24 pela API,
  # `required_status_checks` traz `build` e `contrato`, com
  # `strict_required_status_checks_policy`. A INV-067a esta mecanizada; o
  # comentario anterior, dizendo que "ainda nao bloqueia", ficou velho.
  #
  # O contrato vem do SHA em `src/lib/contrato.lock.json`, por `raw` imutavel.
  # Merge no Back NAO deixa este job vermelho: quem acompanha o `main` do Back
  # e o `contrato.yml` agendado, que abre PR em vez de reprovar a sua.
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # So para ter o `openapi-typescript` na versao do lockfile.
      - run: pnpm install --frozen-lockfile

      # O autoteste roda ANTES: se a comparacao estiver quebrada, o veredito
      # sobre os tipos nao vale nada.
      #
      # **E os dois passos exigem a LINHA de sucesso, nao so o exit 0.** Ao
      # replicar este gate para o Admin, uma conversao de caminho do Git Bash
      # gravou o script com ZERO bytes -- e `node` num arquivo vazio sai 0. O
      # gate ficou "verde" sem ter conferido nada, e so o tamanho do arquivo
      # denunciou. Exit code sozinho nao prova que o gate rodou.
      - name: autoteste do gate
        run: |
          saida="$(node .github/scripts/conferir-contrato.mjs --autoteste)"
          echo "$saida"
          echo "$saida" | grep -Eq '^autoteste: ([0-9]+) de \1$'

      - name: tipos contra o contrato fixado
        run: |
          saida="$(node .github/scripts/conferir-contrato.mjs)"
          echo "$saida"
          echo "$saida" | grep -q '^OK src/lib/api-types.ts em dia'

  # SPEC-072/AC-005 -- **a prova VISUAL, em navegador de verdade.**
  #
  # Job proprio pelo mesmo motivo do `contrato`: e pelo NOME que um ruleset
  # pode vir a exigi-lo. Hoje ele NAO e required -- `build` e `contrato` sao
  # os dois da regra --, entao ele aparece na PR sem bloquear. Fica declarado
  # aberto, e nao "mecanizado".
  #
  # Por que existe: a queixa que originou a SPEC-072 e geometrica, e o
  # `vitest` deste repositorio roda em jsdom, que NAO TEM layout engine --
  # `getBoundingClientRect()` devolve zero em tudo. Asserção de texto fica
  # verde com `overflow:hidden` num ancestral, com conteudo atras do botao e
  # com overflow horizontal. Ou a prova e de navegador, ou nao e prova (D2).
  #
  # So `chromium`: um navegador ja da layout de verdade, e tres triplicariam
  # o tempo do job sem responder outra pergunta. `--with-deps` porque o
  # runner do Ubuntu nao traz as bibliotecas de sistema que o Chromium pede.
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:navegador:instalar

      # O `playwright.config.ts` constroi a app e sobe o `next start` sozinho
      # (`webServer`), entao nao ha passo de build aqui: o objeto do
      # julgamento e o bundle de PRODUCAO, nao o `next dev`.
      - run: pnpm run test:navegador

      # O trace so e gravado quando um caso falha (`retain-on-failure`).
      # Sem ele, uma falha que so acontece no runner fica sem diagnostico.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
